# Claude answers when it is mentioned: `@claude` in an issue, in a comment, in a
# pull request review or in a review comment.
#
# Why this exists: the README invites contributions, and every rule the project
# lives by is written down in `CLAUDE.md` for anyone, human or not, who opens
# the repository. This workflow lets a maintainer ask a question or delegate a
# change from GitHub itself, and the answer reads that same file first.
#
# Two safeguards, both deliberate:
#
# - Only people with write access to this repository can trigger a run. The
#   action checks the author of the mention itself; `@claude` typed by a
#   stranger in a public issue does nothing, and does not spend the key.
# - The token never appears here. `CLAUDE_KEY` is a repository secret,
#   read at run time, and a test refuses this file if a literal token ever
#   replaces the reference. It is an OAuth token of a Claude subscription,
#   obtained with `claude setup-token`, not a Claude Console API key.
#
# The test suite has its own workflow, `tests.yml`, and this one does not
# touch it: a push made from here runs the suite like any other push.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read the result of `tests.yml` on a pull request

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # The subscription token, not an API key: `CLAUDE_KEY` must hold
          # the value printed by `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_KEY }}
